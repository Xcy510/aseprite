name: Build Aseprite Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch: # ✅ 可以手动点击运行，推荐

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Aseprite source
        uses: actions/checkout@v4
        with:
          submodules: recursive # 拉取laf子模块

      - name: Download prebuilt Skia
        run: |
          mkdir C:\deps
          cd C:\deps
          curl -L -o Skia-Windows-Release-x64.zip https://github.com/aseprite/skia/releases/download/m102-861e4743af/Skia-Windows-Release-x64.zip
          Expand-Archive Skia-Windows-Release-x64.zip -DestinationPath C:\deps\skia

      - name: Setup MSVC, CMake, Ninja
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: CMake configure
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR=C:\deps\skia `
            -DSKIA_LIBRARY_DIR=C:\deps\skia\out\Release-x64 `
            -DSKIA_LIBRARY=C:\deps\skia\out\Release-x64\skia.lib `
            -G Ninja ..

      - name: Build Aseprite
        run: |
          cd build
          ninja aseprite

      - name: Package artifacts
        run: |
          Compress-Archive -Path build/bin -DestinationPath aseprite-win.zip

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-build
          path: aseprite-win.zip
